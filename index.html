<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>فارما برو | نظام إدارة ومحاسبة الصيدلية الذكي</title>
    <meta name="description" content="برنامج محاسبة ودفتر حسابات متكامل للصيدليات والشركات، متوافق مع الآيفون والكمبيوتر. تصميم المهندس مالك حريبات 0594345464." />
    <meta property="og:title" content="فارما برو | نظام إدارة ومحاسبة الصيدلية الذكي" />
    <meta property="og:description" content="برنامج محاسبة ودفتر حسابات متكامل للصيدليات والشركات، متوافق مع الآيفون والكمبيوتر. تصميم المهندس مالك حريبات 0594345464." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="فارما برو" />
    <!-- Google Fonts: Cairo for modern Arabic display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS with Arabic typography & mobile optimization -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'system-ui', '-apple-system', 'sans-serif'],
              cairo: ['Cairo', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-cyan-500 selection:text-white min-h-screen">
    <div id="root">
      <!-- High Performance Fast Preloader -->
      <div id="app-loading-screen" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, #090d16 0%, #0f172a 100%);color:#fff;font-family:'Cairo',system-ui,-apple-system,sans-serif;text-align:center;padding:20px;direction:rtl;-webkit-font-smoothing:antialiased;">
        <div style="position:relative;margin-bottom:18px;">
          <div style="width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#0284c7,#2563eb);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(2,132,199,0.35);border:1px solid rgba(255,255,255,0.15);">
            <span style="font-size:38px;">💊</span>
          </div>
        </div>
        
        <h1 style="margin:0 0 6px 0;font-size:22px;font-weight:900;letter-spacing:-0.5px;color:#f8fafc;">فارما برو | نظام إدارة الصيدلية</h1>
        <p id="loader-status-text" style="margin:0 0 14px 0;color:#94a3b8;font-size:13px;max-width:320px;line-height:1.5;">جاري تشغيل لوحة التحكم المباشرة...</p>
        
        <!-- Animated Progress Pill -->
        <div style="width:200px;height:6px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;margin-bottom:16px;">
          <div id="loader-progress-bar" style="width:30%;height:100%;background:linear-gradient(90deg,#38bdf8,#0284c7);border-radius:999px;transition:width 0.3s ease;animation:pulseProgress 1.5s infinite ease-in-out;"></div>
        </div>

        <div id="loader-error-box" style="margin-top:12px;display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);padding:12px 16px;border-radius:14px;font-size:12px;color:#fca5a5;max-width:340px;word-break:break-word;text-align:right;"></div>

        <!-- Direct Actions if connection is slow -->
        <div id="loader-fallback" style="margin-top:12px;display:none;flex-direction:column;gap:8px;width:100%;max-width:280px;">
          <button onclick="window.location.reload(true)" style="background:#0284c7;color:#fff;border:none;padding:11px 18px;border-radius:14px;font-size:13px;font-family:inherit;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(2,132,199,0.35);display:flex;align-items:center;justify-content:center;gap:6px;">
            <span>🔄 تحديث وإعادة فتح البرنامج</span>
          </button>
          <button onclick="try{localStorage.clear();}catch(e){}window.location.reload(true);" style="background:rgba(255,255,255,0.1);color:#cbd5e1;border:1px solid rgba(255,255,255,0.15);padding:9px 16px;border-radius:14px;font-size:12px;font-family:inherit;cursor:pointer;">
            تفريغ الكاش والتشغيل من جديد
          </button>
        </div>

        <div style="margin-top:24px;font-size:11px;color:#64748b;font-weight:600;">
          تصميم وبرمجة: المهندس مالك حريبات • <span dir="ltr">0594345464</span>
        </div>
        <style>
          @keyframes pulseProgress {
            0% { width: 25%; transform: translateX(-50%); }
            50% { width: 85%; transform: translateX(20%); }
            100% { width: 98%; transform: translateX(0%); }
          }
        </style>
      </div>
    </div>
    <script>
      // Global error monitor for mobile debugging
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('loader-error-box');
        var fb = document.getElementById('loader-fallback');
        var pBar = document.getElementById('loader-progress-bar');
        if (pBar) pBar.style.background = '#ef4444';
        if (errBox) {
          errBox.innerHTML = '<strong>تنبيه في المتصفح:</strong> ' + (e.message || 'حدث انقطاع في تحميل الملفات');
          errBox.style.display = 'block';
        }
        if (fb) fb.style.display = 'flex';
      });

      // Quick fallback timer for slower mobile 3G/4G networks
      setTimeout(function() {
        var status = document.getElementById('loader-status-text');
        var fb = document.getElementById('loader-fallback');
        if (status) status.textContent = 'جاري إنهاء التحميل... اضغط تحديث إذا استمر الانتظار:';
        if (fb) fb.style.display = 'flex';
      }, 3500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
