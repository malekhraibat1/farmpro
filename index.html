  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-cyan-500 selection:text-white min-h-screen">
    <div id="root">
      <!-- Fast Lightweight Initial Preloader -->
      <div id="app-loading-screen" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:'Cairo',system-ui,-apple-system,sans-serif;text-align:center;padding:24px;direction:rtl;">

      setTimeout(function() {
